services:
  backend:
    build:
      context: ./backend
    env_file:
      - ${BACKEND_ENV_FILE:-./backend/.env}
    environment:
      PORT: "5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "5000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "${APP_PORT:-8081}:80"
    restart: unless-stopped
