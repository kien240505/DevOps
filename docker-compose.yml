services:
  database:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: technova-database
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD:-DevOps2026@Pass}"
      MSSQL_PID: "Developer"
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: technova-backend
    depends_on:
      - database
    env_file:
      - path: ${BACKEND_ENV_FILE:-./backend/.env}
        required: false
    environment:
      PORT: "5000"
      DB_SERVER: "${DB_SERVER:-database}"
      DB_USER: "${DB_USER:-sa}"
      DB_PASSWORD: "${DB_PASSWORD:-DevOps2026@Pass}"
      DB_NAME: "${DB_NAME:-DevOps}"
      JWT_SECRET: "${JWT_SECRET:-supersecretjwtkeydevops2026}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "5000"
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: technova-frontend
    depends_on:
      - backend
    ports:
      - "${APP_PORT:-8081}:80"
    restart: unless-stopped

volumes:
  mssql_data:
