name: CI/CD - Docker Build & Push

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Validate Frontend Build
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Validate Backend
        run: |
          cd backend
          npm ci

      - name: Login to DockerHub
        if: ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Frontend Image
        if: ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != '' }}
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/technova-frontend:latest \
            -t ${{ secrets.DOCKER_USERNAME }}/technova-frontend:${{ github.sha }} ./frontend
          docker push ${{ secrets.DOCKER_USERNAME }}/technova-frontend:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/technova-frontend:${{ github.sha }}

      - name: Build & Push Backend Image
        if: ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != '' }}
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/technova-backend:latest \
            -t ${{ secrets.DOCKER_USERNAME }}/technova-backend:${{ github.sha }} ./backend
          docker push ${{ secrets.DOCKER_USERNAME }}/technova-backend:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/technova-backend:${{ github.sha }}